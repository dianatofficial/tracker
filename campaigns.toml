# Campaigns published by scripts/build_campaigns.py when the site is assembled.
# Each entry becomes a static page at campaigns/<id>/.

[[campaign]]
id = "musl-aarch64"
title = "musllinux aarch64 wheels for the top 500"
platform = "musl-aarch64"
top = 500
start = "2026-11-11"
# Pinned, so the campaign doesn't jump to a new Python (and a new to-do list) when the scan adds one.
python = "3.14"
description = "musllinux aarch64 is what pip installs from in python:*-alpine images on ARM64 hosts such as AWS Graviton, Ampere and Apple-silicon machines running Docker. This page turns the gaps among the most-downloaded packages into a list people can work through, one package at a time."
how_to = "https://github.com/wheelgap/tracker/blob/main/docs/adding-wheels-upstream.md"

[[campaign]]
id = "win-arm64"
title = "Windows on ARM wheels for the top 500"
platform = "win-arm64"
top = 500
start = "2026-11-12"
python = "3.14"
description = "Windows on ARM is what Copilot+ PCs and other Snapdragon X laptops run, and with Alpine ARM64 it is one of the two thinnest native platforms on this tracker. GitHub's free windows-11-arm runners for public repositories mean a project can now build and test win_arm64 wheels natively instead of cross-compiling them untested. This page turns the gaps among the most-downloaded packages into a list people can work through, one package at a time."
sources = [
    "https://blogs.microsoft.com/blog/2024/05/20/introducing-copilot-pcs/",
    "https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/",
    "https://cibuildwheel.pypa.io/en/stable/platforms/#windows-arm64",
]
how_to = "https://github.com/wheelgap/tracker/blob/main/docs/adding-wheels-upstream.md#windows-on-arm-win_arm64"

[[campaign]]
id = "py315-linux"
title = "Python 3.15 wheels on Linux x86_64 for the top 500"
platform = "linux-x86_64"
top = 500
start = "2026-11-16"
python = "3.15"
# Compared with 3.14 on the same platform: on a new Python most packages have no wheel anywhere yet.
compare = "python"
description = "A new Python is when maintainers most need a nudge: until a package uploads wheels for it, everyone on that Python builds it from source, or can't install it at all. Linux x86_64 is where most people try a new Python first, in CI and in python:3.15 containers. This page turns the gaps among the 500 most-downloaded packages into a list people can work through, one package at a time."
how_to = "https://github.com/wheelgap/tracker/blob/main/docs/adding-wheels-upstream.md"

[[campaign]]
id = "ft-314-linux"
title = "Free-threaded Python 3.14 wheels on Linux x86_64 for the top 500"
platform = "linux-x86_64"
top = 500
start = "2026-11-21"
python = "3.14t"
# Compared with regular 3.14 on the same platform: most 3.14t gaps have no 3.14t wheel on any platform.
compare = "gil"
description = "Free-threaded Python (3.14t) runs without the global interpreter lock, so threads can run Python code on several cores at once. A package with compiled code needs its own cp314t wheel for it; until it uploads one, everyone on 3.14t builds it from source, or can't install it at all. This page lists the packages among the 500 most-downloaded that ship a Linux x86_64 wheel for regular Python 3.14 but none for 3.14t. Publishing a cp314t wheel is taken as saying the package supports free-threading, so the thing to do is ask its maintainers whether that is planned, one package at a time, not send a build change."
sources = [
    "https://docs.python.org/3/howto/free-threading-python.html",
    "https://py-free-threading.github.io/",
]
how_to = "https://github.com/wheelgap/tracker/blob/main/docs/adding-wheels-upstream.md#free-threaded-python-cp314t"

[[campaign]]
id = "py315-windows"
title = "Python 3.15 wheels on Windows x64 for the top 500"
platform = "win-amd64"
top = 500
start = "2026-11-22"
python = "3.15"
# Compared with 3.14 on the same platform: on a new Python most packages have no wheel anywhere yet.
compare = "python"
description = "Windows x64 is where many people meet a new Python first, and a missing wheel hurts more there: a source build needs Visual Studio's C++ build tools, which most Windows users don't have, so building from source usually means the package can't be installed at all. This page lists the packages among the 500 most-downloaded that ship a Windows x64 wheel for Python 3.14 but none for 3.15, turning the gaps into a list people can work through, one package at a time."
sources = [
    "https://peps.python.org/pep-0790/",
    "https://cibuildwheel.pypa.io/en/stable/changelog/",
]
how_to = "https://github.com/wheelgap/tracker/blob/main/docs/adding-wheels-upstream.md#python-315-on-windows-cp315-win_amd64"
